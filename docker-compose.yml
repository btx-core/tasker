# Postgres untuk pengembangan & uji. Versi 17 (ADR-018: minimum 16, diuji 16 & 17).
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: kelindan
      POSTGRES_PASSWORD: kelindan
      POSTGRES_DB: kelindan
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kelindan"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes: ["pgdata:/var/lib/postgresql/data"]
volumes:
  pgdata:
