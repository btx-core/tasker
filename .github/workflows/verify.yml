# CI: menjalankan yang SUDAH ada, bukan menulis uji baru.
#
# KENAPA INI PRIORITAS PERTAMA: sebelum berkas ini ada, 189 uji hanya berjalan
# bila seseorang ingat menjalankannya. Kode di `main` terlihat teruji dan tidak
# ada yang memberi tahu bahwa tidak ada yang menjaganya. Itu kegagalan yang
# tak terlihat, dan karena itu paling berbahaya.
name: verify

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # PR yang di-push ulang membatalkan run lama: menghabiskan kuota untuk hasil
  # yang sudah usang hanya memperlambat umpan balik.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lapis 1 — cepat, tanpa database jaringan. Ini yang harus hijau sebelum
  # siapa pun meninjau.
  unit:
    name: unit + lint + batas modul
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run lint:boundary
      - name: unit test (tanpa database jaringan)
        run: npm test 2>&1 | tee /tmp/unit.log
      - name: pastikan uji jaringan tidak "hijau" karena dilewati
        # Di job ini database TIDAK tersedia, jadi uji jaringan memang harus
        # dilewati. Yang diperiksa: jumlah yang dilewati HARUS tepat sama
        # dengan yang diharapkan. Kalau bertambah, ada uji yang diam-diam
        # berhenti berjalan.
        run: |
          # Ambil baris RINGKASAN ("Tests  N passed | M skipped"), BUKAN baris
          # per-berkas. Versi pertama gerbang ini memakai `head -1` sehingga
          # membaca 7 (berkas pertama), bukan 17 (total) — CI akan gagal tanpa
          # alasan yang benar.
          n=$(grep -E "^ *Tests +[0-9]+ passed" /tmp/unit.log | grep -oE "[0-9]+ skipped" | grep -oE "[0-9]+" || echo 0)
          echo "uji dilewati: $n (diharapkan 17)"
          if [ "$n" -ne 17 ]; then
            echo "::error::jumlah uji yang dilewati berubah ($n, diharapkan 17). Periksa apakah uji jaringan ikut dilewati pada PR ini."
            exit 1
          fi
      - name: bundel UI
        run: npm run build:web && npm run bundle:check

  # Lapis 2 — PostgreSQL sungguhan. Inilah yang membuktikan konkurensi,
  # LISTEN/NOTIFY, dan pencabutan akses; tidak satu pun bisa dibuktikan PGlite.
  #
  # MATRIKS 16 & 17: `testing-strategy.md` §10 butir 6 mensyaratkannya. Sampai
  # sekarang yang pernah dijalankan hanya 16.2 dan 18.6 — matriks itu belum
  # pernah diuji, dan matriks yang tidak pernah dijalankan hanyalah niat.
  database:
    name: postgres ${{ matrix.postgres }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["16", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kelindan_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      KELINDAN_PG_URL: postgres://postgres:postgres@127.0.0.1:5432/kelindan_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: ekstensi yang dibutuhkan skema
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d kelindan_test \
            -c "CREATE EXTENSION IF NOT EXISTS citext; CREATE EXTENSION IF NOT EXISTS pg_trgm;"
      - name: uji konkurensi + real-time pada PostgreSQL nyata
        # WAJIB gagal bila uji ini DILEWATI. Tanpa pemeriksaan ini, CI akan
        # hijau meskipun `KELINDAN_PG_URL` salah ketik — dan hijau palsu lebih
        # berbahaya daripada merah.
        run: |
          npm run test:realpg 2>&1 | tee /tmp/realpg.log
      - name: gerbang "jangan hijau palsu"
        run: bash scripts/assert-not-skipped.sh /tmp/realpg.log

  # Lapis 3 — invarian yang tidak boleh dibiarkan "belum pernah dijalankan".
  # Sengaja terpisah dari `unit` supaya kegagalannya menunjuk langsung ke
  # masalahnya, bukan terkubur di antara 189 uji.
  guard:
    name: penjaga repo (migrasi, batas, rahasia)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: tidak ada migrasi destruktif
        # Menghapus tabel/kolom di migrasi yang sudah dirilis akan menghancurkan
        # data pelanggan tanpa peringatan. Perubahan destruktif harus lewat
        # migrasi baru + catatan, bukan mengubah berkas lama.
        run: |
          if git ls-files 'packages/db/migrations/*.sql' | xargs grep -inE "^\s*(DROP\s+(TABLE|COLUMN|DATABASE)|TRUNCATE)" ; then
            echo "::error::migrasi memuat pernyataan destruktif — tinjau manual"
            exit 1
          fi
      - name: tidak ada kredensial di repo
        run: |
          # Kecualikan berkas uji: fixture seperti "postgres://u:p@localhost/db"
          # adalah data uji, bukan rahasia. Versi pertama penjaga ini menandainya
          # sebagai kebocoran dan akan memblokir setiap PR.
          if git grep -nE "(postgres|postgresql)://[^@[:space:]]+:[^@[:space:]]+@" -- \
               ':!*.md' ':!*.yml' ':!*.example' ':!*.test.ts' ':!*.int.test.ts' \
               ':!*.realpg.test.ts' ':!scripts/*'; then
            echo "::error::URL database dengan kata sandi ditemukan di kode"
            exit 1
          fi
      - name: berkas build tidak ikut ter-commit
        run: |
          if git ls-files | grep -E "(^|/)(dist|public/main\.js|node_modules|.*\.tsbuildinfo)$"; then
            echo "::error::artefak build ter-commit"
            exit 1
          fi
